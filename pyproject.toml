[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agency-report-builder"
version = "1.1.0"
description = "Generate branded HTML and PDF marketing performance reports from GA4 and Google Search Console data"
authors = [{ name = "Mehran Moghadasi", email = "mehran.moghadasi@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["ga4", "google-search-console", "reporting", "pdf", "marketing", "agency", "analytics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Office/Business",
]
dependencies = [
    "click>=8.1",
    "google-analytics-data>=0.18",
    "google-auth>=2.28",
    "google-auth-httplib2>=0.2",
    "google-api-python-client>=2.120",
    "jinja2>=3.1",
    "weasyprint>=61",
    "rich>=13",
    "python-dateutil>=2.9",
    "pydantic>=2.6",
]

[project.scripts]
report-builder = "report_builder.cli:cli"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
report_builder = ["templates/*.j2"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
